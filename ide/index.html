<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IDE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; }
        #editor { flex: 1; width: 100vw; height: 70vh; }
        #output { height: 30vh; background: black; color: white; padding: 10px; overflow: auto; font-family: monospace; }
        button { padding: 10px; font-size: 16px; margin: 5px; }
    </style>
</head>
<body>
    <div id="editor"></div>
    <button onclick="runCode()">Run Code</button>
    <pre id="output">// Output will appear here</pre>

    <script>
        var require = { paths: { vs: "https://unpkg.com/monaco-editor@latest/min/vs" } };
    </script>
    <script src="https://unpkg.com/monaco-editor@latest/min/vs/loader.js"></script>
    <script>
        require(["vs/editor/editor.main"], function () {
            window.editor = monaco.editor.create(document.getElementById("editor"), {
                value: "const sum = 5 + 10;\nreturn sum;",
                language: "javascript",
                theme: "vs-dark"
            });
        });

        async function runCode() {
            const code = editor.getValue();
            const output = document.getElementById("output");
            output.textContent = "// Running...";

            try {
                const logs = [];
                const consoleProxy = {
                    log: (...values) => logs.push(values.map(formatValue).join(" ")),
                    info: (...values) => logs.push(values.map(formatValue).join(" ")),
                    warn: (...values) => logs.push(values.map(formatValue).join(" ")),
                    error: (...values) => logs.push(values.map(formatValue).join(" "))
                };
                const result = await new Function(
                    "console",
                    `"use strict"; return (async () => { ${code}\n })();`
                )(consoleProxy);
                const resultText = result === undefined ? "" : formatValue(result);
                output.textContent = [...logs, resultText].filter(Boolean).join("\n") || "// Done";
            } catch (error) {
                output.textContent = "Error: " + error.message;
            }
        }

        function formatValue(value) {
            if (typeof value === "string") return value;
            try {
                return JSON.stringify(value);
            } catch {
                return String(value);
            }
        }
    </script>
</body>
</html>
